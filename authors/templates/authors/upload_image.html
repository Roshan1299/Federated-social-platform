{% extends 'base.html' %}
{% block title %}Upload Image{% endblock %}

{% block content %}
<div class="upload-container">
  <h1>Upload a New Image</h1>
  <p>Upload a JPG, PNG, or GIF (max size: 5MB).</p>

  <form method="post" enctype="multipart/form-data" class="upload-form">
    {% csrf_token %}
    <input type="file" name="image" accept="image/*" required class="file-input">

    <!-- Preserve ?next=/back/url -->
    <input type="hidden" name="next" value="{{ request.GET.next }}">

    <button type="submit" class="btn btn-primary">Upload</button>

    <!-- Back button goes to previous page -->
    {% if request.GET.next %}
      <a href="{{ request.GET.next }}" class="btn btn-secondary">Back</a>
    {% else %}
      <a href="{% url 'authors:edit_profile' user.id %}" class="btn btn-secondary">Back to Profile</a>
    {% endif %}
  </form>
</div>

<style>
.upload-container {
  max-width: 600px;
  margin: 60px auto;
  background: var(--bg-secondary);
  padding: 25px 30px;
  border-radius: 10px;
  box-shadow: var(--card-shadow);
  text-align: center;
  border: 1px solid var(--border-color);
  color: var(--text-primary);
}

.upload-form {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
}

.file-input {
  border: 1px solid var(--border-color);
  padding: 8px;
  border-radius: 6px;
  width: 100%;
  max-width: 400px;
  background-color: var(--bg-primary);
  color: var(--text-primary);
}

.btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  text-decoration: none;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s ease;
}

.btn-primary {
  background: #3a7bd5;
  color: white;
}

.btn-primary:hover {
  background: #2a5a9f;
  color: white;
}

.btn-secondary {
  background: var(--border-color);
  color: var(--text-primary);
}

.btn-secondary:hover {
  background: #475569;
  color: white;
}
</style>
{% endblock %}
