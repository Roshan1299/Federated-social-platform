{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
  <h2>Follow a Remote Author</h2>
  <p class="text-muted">
    Paste the full API URL (FQID) of the remote author you want to follow.
    For example: <code>https://other-node.herokuapp.com/api/authors/&lt;uuid&gt;/</code>
  </p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      <label for="remote_author_url" class="form-label">Remote author URL</label>
      <input
        type="url"
        class="form-control"
        id="remote_author_url"
        name="remote_author_url"
        placeholder="https://other-node.herokuapp.com/api/authors/123e4567-e89b-12d3-a456-426614174000/"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary">
      Send Follow Request
    </button>
    <a href="{% url 'authors:author_stream' author_id=request.user.id %}" class="btn btn-secondary ms-2">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
