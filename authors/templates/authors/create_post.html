{% extends 'base.html' %}

{% block content %}
<div class="post-form-container">
  <div class="post-form-header">
    <h1>Create New Post</h1>
  </div>

  <form method="post" enctype="multipart/form-data" class="post-form">
    {% csrf_token %}
    {{ form.non_field_errors }}

    <div class="form-row">
      <div class="form-group">
        <label for="{{ form.title.id_for_label }}">Title</label>
        {{ form.title }}
      </div>

      <div class="form-group">
        <label for="{{ form.visibility.id_for_label }}">Visibility</label>
        {{ form.visibility }}
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="{{ form.description.id_for_label }}">Description (Optional)</label>
        {{ form.description }}
      </div>
      <div class="form-group">
        <label for="{{ form.contentType.id_for_label }}">Content Type</label>
        {{ form.contentType }}
      </div>
    </div>

    <div class="form-group">
      <label for="{{ form.content.id_for_label }}">Content</label>
      {{ form.content }}
    </div>

    <div class="form-group">
        <label for="{{ form.image.id_for_label }}">Image (Optional)</label>
        {{ form.image }}
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Publish Post</button>
      <a href="{% url 'authors:author_profile' user.id %}" class="btn btn-secondary">Back to Profile</a>
    </div>
  </form>
</div>
{% endblock %}
