{% extends 'base.html' %}

{% block content %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <img width=150px src="{% if author.profileImage %} {{author.profileImage.url}} {% endif %}" alt="{{ author.displayName }}'s Profile Image">
    <br>
    {% if editable %}
      <input type="file" name="profileImage" accept="image/*">
    {% endif %}
    
    <h1>
      <input type="text" name="displayName" value="{{ author.displayName }}" {% if not editable %}readonly{% endif %}>
    </h1>
    <p>
      <textarea name="description" {% if not editable %}readonly{% endif %}>{{ author.description }}</textarea>
    </p>
    {% if editable %}
    <input type="url" name="github" value="{{ author.github }}">
    {% else %}
    <a href="{{ author.github }}">GitHub Profile</a>
    {% endif %}

        <br>
    {% block edit_button %}
      <a href="{% url 'authors:edit_profile' author.id %}">Edit Profile</a>
    {% endblock %}
    {% if editable %}
      <button type="submit">Save Changes</button>
    {% endif %}
  </form>
{% endblock %}
