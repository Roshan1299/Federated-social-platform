{% extends 'base.html' %}
{% block content %}
<div class="post-form-container">
  <div class="post-form-header">
    <h1>Edit Post</h1>
    <p>Update your post content and visibility settings</p>
  </div>

  <form method="post" enctype="multipart/form-data" class="post-form">
    {% csrf_token %}
    
    <div class="post-form-row">
      <div class="form-group">
        <label for="{{ form.title.id_for_label }}">Title</label>
        {{ form.title }}
      </div>
      <div class="form-group">
        <label for="{{ form.visibility.id_for_label }}">Visibility</label>
        {{ form.visibility }}
      </div>
    </div>

    <div class="post-form-row">
      <div class="form-group">
        <label for="{{ form.contentType.id_for_label }}">Content Type</label>
        {{ form.contentType }}
      </div>
    </div>

    <div class="form-group">
      <label for="{{ form.content.id_for_label }}">Description</label>
      {{ form.content }}
    </div>

    <div class="form-group">
        <label for="{{ form.image.id_for_label }}">Image (Optional)</label>
        {{ form.image }}
    </div>

    <div class="form-actions">
      <a href="{% url 'authors:author_profile' user.id %}" class="btn btn-secondary">Cancel</a>
      <button type=\"submit\" class=\"btn btn-primary\">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
